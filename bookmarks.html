<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Printable Bookmarks — I Like It Deep</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Lora:ital@1&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #FAF6EF; font-family: 'Poppins', sans-serif; color: #4a3b2a; }
  .wrap { max-width: 800px; margin: 0 auto; padding: 30px 20px 60px; text-align: center; }
  h1 { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 36px; color: #8a2f4b; margin-bottom: 6px; }
  .sub { font-family: 'Lora', serif; font-style: italic; font-size: 17px; margin-bottom: 40px; }
  .sheet { margin-bottom: 50px; }
  .sheet img { width: 100%; max-width: 500px; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); margin-bottom: 10px; cursor: pointer; }
  .tap-hint { font-size: 13px; color: #8a2f4b; margin-bottom: 16px; font-style: italic; }
  .download-btn { display: inline-block; background: #8a2f4b; color: #fff; padding: 12px 30px; border-radius: 30px; text-decoration: none; font-weight: 500; }
  .note { font-size: 14px; color: #7a6a5a; margin-top: 40px; }
  .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); z-index: 999; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
  .modal-content { background: #FAF6EF; border-radius: 14px; padding: 20px; max-width: 500px; width: 100%; text-align: center; position: relative; max-height: 90vh; overflow-y: auto; }
  .modal-content img { width: 100%; border-radius: 10px; margin-bottom: 16px; }
  .modal-close { position: absolute; top: 10px; right: 16px; font-size: 28px; color: #8a2f4b; cursor: pointer; font-weight: bold; line-height: 1; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Free Printable Bookmarks</h1>
  <p class="sub">Print at home, cut along the lines, and keep your place.</p>

  <div class="sheet">
    <img class="preview-img" data-full="images/bookmarks-sheet-1-thumb.jpg" data-pdf="images/bookmarks-sheet-1.pdf" src="images/bookmarks-sheet-1-thumb.jpg" alt="Bookmark sheet 1">
    <div class="tap-hint">Tap image to preview</div>
    <a class="download-btn" href="images/bookmarks-sheet-1.pdf" download>Download Sheet 1</a>
  </div>

  <div class="sheet">
    <img class="preview-img" data-full="images/bookmarks-sheet-2-thumb.jpg" data-pdf="images/bookmarks-sheet-2.pdf" src="images/bookmarks-sheet-2-thumb.jpg" alt="Bookmark sheet 2">
    <div class="tap-hint">Tap image to preview</div>
    <a class="download-btn" href="images/bookmarks-sheet-2.pdf" download>Download Sheet 2</a>
  </div>

  <p class="note">Print on cardstock for best results, then trim along the edges.</p>
</div>

<div class="modal" id="previewModal">
  <div class="modal-content" id="modalContent">
    <span class="modal-close" id="modalClose">&times;</span>
    <img id="modalImg" src="" alt="Preview">
    <a id="modalDownload" class="download-btn" href="" download>Download This Sheet</a>
  </div>
</div>

<script>
  var modal = document.getElementById('previewModal');
  var modalImg = document.getElementById('modalImg');
  var modalDownload = document.getElementById('modalDownload');
  var imgs = document.querySelectorAll('.preview-img');

  for (var i = 0; i < imgs.length; i++) {
    imgs[i].addEventListener('click', function() {
      modalImg.src = this.getAttribute('data-full');
      modalDownload.href = this.getAttribute('data-pdf');
      modal.style.display = 'flex';
    });
  }

  document.getElementById('modalClose').addEventListener('click', function() {
    modal.style.display = 'none';
  });
  modal.addEventListener('click', function(e) {
    if (e.target === modal) { modal.style.display = 'none'; }
  });
</script>
</body>
</html>
