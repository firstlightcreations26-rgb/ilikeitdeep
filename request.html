
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request a Journal — I Like It Deep</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Karla:wght@400;500;600&family=Poppins:wght@400;500;600&family=Lora:ital@1&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .nav-wrap{position:relative;}
  .menu-toggle{background:transparent;border:1px solid var(--line);color:var(--muted);font-family:'Karla',sans-serif;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;padding:11px 20px;border-radius:24px;cursor:pointer;display:flex;align-items:center;gap:8px;}
  .menu-toggle:hover{color:var(--rose);border-color:var(--rose);}
  .menu-arrow{transition:transform 0.2s ease;font-size:11px;}
  .menu-toggle[aria-expanded="true"] .menu-arrow{transform:rotate(180deg);}
  .dropdown-menu{display:none;flex-direction:column;position:absolute;top:calc(100% + 10px);right:0;background:var(--bg-soft);border:1px solid var(--line);border-radius:14px;padding:8px;min-width:210px;z-index:50;box-shadow:0 14px 34px rgba(0,0,0,0.4);}
  .dropdown-menu.open{display:flex;}
  .dropdown-menu a{padding:13px 16px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;}
  .dropdown-menu a:hover{background:var(--bg);color:var(--rose);}
  .back-link{display:inline-block;margin:22px 0 0;color:var(--muted);font-size:13px;letter-spacing:0.06em;text-transform:uppercase;text-decoration:none;}
  .back-link:hover{color:var(--rose);}
  .request-page{padding:20px 0 90px;max-width:560px;margin:0 auto;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><img src="images/logo.png" alt="I Like It Deep logo" style="height:50px;"></div>
    <div class="nav-wrap">
      <button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="mainMenu" onclick="toggleMainMenu()">Menu <span class="menu-arrow">▾</span></button>
      <nav id="mainMenu" class="dropdown-menu">
        <a href="index.html">Home</a>
        <a href="collection.html">Journals</a>
        <a href="blog.html">Blog</a>
        <a href="bookmarks.html">Bookmarks</a>
        <a href="coloring-pages.html">Coloring Pages</a>
        <a href="about.html">About</a>
        <a href="request.html">Request a Journal</a>
      </nav>
    </div>
  </header>

  <section class="request-page">
    <a href="index.html" class="back-link">← Back to Home</a>
    <div class="section-sub" style="margin-top:24px;">Don't See It Yet?</div>
    <div class="section-title">Request a Journal</div>
    <div class="request-box">
      <p>Going through something that isn't covered yet? Tell us about it — if it fits, we'll build it.</p>
      <input type="text" placeholder="Your name" />
      <input type="email" placeholder="Your email" />
      <textarea rows="4" placeholder="What kind of journal would help you?"></textarea>
      <a href="mailto:ilikeitdeep26@gmail.com?subject=Journal%20Request" class="request-submit">Send Request</a>
    </div>
  </section>
</div>
<script>
function toggleMainMenu(){
  var menu = document.getElementById('mainMenu');
  var btn = document.getElementById('menuToggle');
  var isOpen = menu.classList.toggle('open');
  btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
}
document.addEventListener('click', function(e){
  var wrap = document.querySelector('.nav-wrap');
  if(wrap && !wrap.contains(e.target)){
    document.getElementById('mainMenu').classList.remove('open');
    document.getElementById('menuToggle').setAttribute('aria-expanded', 'false');
  }
});
</script>
</body>
</html>
