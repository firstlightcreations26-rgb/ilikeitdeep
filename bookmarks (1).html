<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Printable Bookmarks — I Like It Deep</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Lora:ital@1&family=Poppins:wght@400;500&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #FAF6EF; font-family: 'Poppins', sans-serif; color: #4a3b2a; }
  .wrap { max-width: 800px; margin: 0 auto; padding: 0 20px 60px; }
  .content { text-align: center; padding-top: 30px; }
  h1 { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 36px; color: #8a2f4b; margin-bottom: 6px; }
  .sub { font-family: 'Lora', serif; font-style: italic; font-size: 17px; margin-bottom: 40px; }
  .sheet { margin-bottom: 50px; }
  .sheet img { width: 100%; max-width: 500px; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); margin-bottom: 16px; }
  .download-btn { display: inline-block; background: #8a2f4b; color: #fff; padding: 12px 30px; border-radius: 30px; text-decoration: none; font-weight: 500; }
  .note { font-size: 14px; color: #7a6a5a; margin-top: 40px; }

  header{padding:18px 0;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(138,47,75,0.16);}
  .logo{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:22px;color:#8a2f4b;}
  .nav-wrap{position:relative;}
  .menu-toggle{background:transparent;border:1px solid rgba(138,47,75,0.16);color:#8a7a72;font-family:'Karla',sans-serif;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;padding:11px 20px;border-radius:24px;cursor:pointer;display:flex;align-items:center;gap:8px;}
  .menu-toggle:hover{color:#8a2f4b;border-color:#8a2f4b;}
  .menu-arrow{transition:transform 0.2s ease;font-size:11px;}
  .menu-toggle[aria-expanded="true"] .menu-arrow{transform:rotate(180deg);}
  .dropdown-menu{display:none;flex-direction:column;position:absolute;top:calc(100% + 10px);right:0;background:#FFFFFF;border:1px solid rgba(138,47,75,0.16);border-radius:14px;padding:8px;min-width:210px;z-index:50;box-shadow:0 14px 34px rgba(0,0,0,0.12);}
  .dropdown-menu.open{display:flex;}
  .dropdown-menu a{padding:13px 16px;border-radius:10px;color:#8a7a72;text-decoration:none;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;display:block;}
  .dropdown-menu a:hover{background:#FAF6EF;color:#8a2f4b;}
  .back-link { display:inline-flex; align-items:center; gap:6px; color:#8a2f4b; text-decoration:none; font-size:14px; margin:20px 0; font-weight:500; }
  .back-link:hover { text-decoration:underline; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">I like it deep</div>
    <div class="nav-wrap">
      <button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="mainMenu" onclick="toggleMainMenu()">Menu <span class="menu-arrow">▾</span></button>
      <nav id="mainMenu" class="dropdown-menu">
        <a href="index.html">Home</a>
        <a href="collection.html">Journals</a>
        <a href="blog.html">Blog</a>
        <a href="bookmarks.html">Bookmarks</a>
        <a href="coloring-pages.html">Coloring Pages</a>
        <a href="about.html">About</a>
        <a href="index.html#request">Request a Journal</a>
      </nav>
    </div>
  </header>

  <div class="content">
    <a href="index.html" class="back-link">&larr; Back to Home</a>
    <h1>Free Printable Bookmarks</h1>
    <p class="sub">Print at home, cut along the lines, and keep your place.</p>
    <div class="sheet">
      <img src="images/010CA2D1-6CCA-480E-9B48-A77F5C64CC44.PNG" alt="Bookmark sheet 1">
      <br>
      <a class="download-btn" href="images/010CA2D1-6CCA-480E-9B48-A77F5C64CC44.PNG" download>Download Sheet 1</a>
    </div>
    <div class="sheet">
      <img src="images/IMG_2475.PNG" alt="Bookmark sheet 2">
      <br>
      <a class="download-btn" href="images/IMG_2475.PNG" download>Download Sheet 2</a>
    </div>
    <p class="note">Print on cardstock for best results, then trim along the edges.</p>
  </div>
</div>
<script>
function toggleMainMenu(){
  var menu = document.getElementById('mainMenu');
  var btn = document.getElementById('menuToggle');
  var isOpen = menu.classList.toggle('open');
  btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
}
document.addEventListener('click', function(e){
  var wrap = document.querySelector('.nav-wrap');
  if(wrap && !wrap.contains(e.target)){
    document.getElementById('mainMenu').classList.remove('open');
    document.getElementById('menuToggle').setAttribute('aria-expanded', 'false');
  }
});
</script>
</body>
</html>
